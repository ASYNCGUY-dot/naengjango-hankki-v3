# Supabase 무료 플랜은 활동이 부족하면 프로젝트를 일시정지한다.
#
# 기준은 "지난 일주일 동안 매일 몇 번씩 DB 요청이 있었는가"다. 공식 문서 표현은
# "a few user requests to the database each day over the previous week"
# (https://supabase.com/docs/guides/platform/free-project-pausing, 2026-09-29 확인).
#
# 처음에는 3일에 한 번, 한 번만 불렀다. 그걸로 "미사용 시계를 되돌린다"고 README에까지
# 적었는데 틀렸다 - 9월 13·16·19·22일 호출이 전부 성공했는데도 22~25일 사이에 다시
# 정지됐다. 기준이 "매일 몇 번"이라 3일에 한 번은 처음부터 모자랐다. 원인을 추측으로
# 두지 않고 문서로 확인한 뒤 고친다.
#
# 그래서 하루 두 번, 한 번 돌 때마다 세 번 조회한다(하루 6회). 문서가 말하는 "몇 번"의
# 정확한 수는 없어서 여유를 둔다.
#
# 왜 이 엔드포인트인가
#   - `/recommendation/recipes/categories`는 DB를 실제로 조회한다(분류별 개수를 센다).
#   - 그러면서 `usage_events`에 아무것도 남기지 않는다. 레시피 상세를 부르면
#     비로그인 `recipe_view`가 쌓이는데, 그건 Phase 4에서 "공유 링크를 받은 사람의
#     열람"과 같은 모양이라 유입 신호를 더럽힌다.
#
# 자격증명을 안 쓴다. DB에 직접 붙는 편이 더 곧지만 이 저장소는 공개라, 접속 문자열을
# Actions 시크릿에 두는 것보다 배포된 API를 거치는 쪽이 노출면이 작다.
#
# 알아둘 한계 둘.
#   - GitHub은 공개 저장소에 60일 동안 커밋이 없으면 예약 워크플로를 자동으로 끈다.
#     그러면 이 작업도 조용히 멈추고 두 번째 정지가 온다. 오래 손을 놓을 때는
#     Actions 탭에서 이 워크플로가 켜져 있는지 확인할 것.
#   - 예약 실행은 GitHub 부하에 따라 늦어지거나 가끔 건너뛴다. 하루 두 번으로 둔 이유다.
#
# 겸사겸사 가용성 점검이기도 하다. 이 작업이 실패하면 그 시점에 앱이 실제로 고장난
# 것이므로, 알림을 받도록 실패 시 종료 코드를 그대로 낸다(2026-09-25에 실제로 이
# 알림이 정지를 먼저 알려줬다).

name: DB 깨어 있게 유지

on:
  schedule:
    # 하루 두 번, UTC 03:17 / 15:17 (한국 12:17 / 00:17). 정각은 GitHub 예약이 몰려
    # 늦어지기 쉬워서 비껴 둔다.
    - cron: "17 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 레시피 분류 목록을 세 번 부른다
        run: |
          URL="https://naengjango-hankki-v2-api.onrender.com/recommendation/recipes/categories"

          # 한 번 조회하고 성공 여부를 돌려준다. 200이어도 분류가 비면 DB가 실제로 답한
          # 것이 아닐 수 있어 실패로 본다.
          query_once() {
            code=$(curl --silent --show-error --max-time 120 \
                        --output /tmp/response.json --write-out '%{http_code}' "$URL" || echo "000")
            if [ "$code" != "200" ]; then
              echo "HTTP $code"
              head -c 300 /tmp/response.json 2>/dev/null || true
              echo
              return 1
            fi
            count=$(python3 -c "import json; print(len(json.load(open('/tmp/response.json'))))" 2>/dev/null || echo 0)
            if [ "$count" -gt 0 ]; then
              echo "정상 - 분류 ${count}개"
              return 0
            fi
            echo "200이지만 분류가 비어 있다. DB 조회가 실패했을 수 있다."
            return 1
          }

          # 첫 조회는 Render 콜드스타트(20~35초)를 기다려야 해서 실패하면 재시도한다.
          ok=0
          for attempt in 1 2 3; do
            echo "첫 조회 시도 $attempt"
            if query_once; then ok=1; break; fi
            [ "$attempt" -lt 3 ] && sleep 30
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::DB 확인 실패. Supabase 프로젝트가 정지됐는지 대시보드에서 볼 것."
            exit 1
          fi

          # 서버가 깨어난 뒤 두 번 더 부른다. Supabase가 세는 것은 "하루에 몇 번"이라
          # 한 번보다 여러 번이 안전하다.
          for n in 2 3; do
            sleep 20
            echo "조회 $n"
            query_once || { echo "::error::깨어난 뒤 조회가 실패했다."; exit 1; }
          done
          echo "세 번 모두 DB가 응답했다."
