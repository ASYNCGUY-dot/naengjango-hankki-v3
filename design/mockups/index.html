<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>냉장고 한끼 V3 — 핵심 화면 시안</title>
<link rel="stylesheet" href="../tokens.css">
<style>
/* 시안 전용 스타일. 값은 전부 design/tokens.css의 변수를 쓴다 - 하드코딩된 색·간격이
   없다는 것을 이 파일 자체로 보이기 위함이다(Phase 2 종료 조건 1번).
   페이지를 감싸는 껍데기(작업대 배경, 폰 프레임)만 시안용 값을 쓴다. */

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-family-base);
  background: var(--color-surface-sunken);
  color: var(--color-text-primary);
  line-height: var(--line-height-base);
  padding: var(--space-6);
}

.toolbar {
  display: flex; align-items: center; gap: var(--space-4);
  max-width: 1400px; margin: 0 auto var(--space-6);
  flex-wrap: wrap;
}
.toolbar h1 { font-size: var(--font-size-xl); letter-spacing: var(--letter-spacing-tight); }
.toolbar p { color: var(--color-text-secondary); font-size: var(--font-size-sm); }

.theme-toggle {
  min-height: var(--touch-target-min); padding: 0 var(--space-4);
  border: 1px solid var(--color-border-strong); border-radius: var(--radius-pill);
  background: var(--color-surface-raised); color: var(--color-text-primary);
  font: inherit; font-weight: var(--font-weight-medium); cursor: pointer;
}
.theme-toggle:focus-visible { outline: 3px solid var(--color-focus-ring); outline-offset: 2px; }

.frames {
  display: flex; gap: var(--space-6); flex-wrap: wrap;
  justify-content: center; max-width: 1400px; margin: 0 auto;
}
.frame { width: 22.5rem; }
.frame > figcaption {
  font-size: var(--font-size-sm); font-weight: var(--font-weight-bold);
  color: var(--color-text-secondary); margin-bottom: var(--space-2);
}

/* 폰 화면 */
.screen {
  height: 46rem; overflow: hidden; position: relative;
  background: var(--color-surface-base);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  display: flex; flex-direction: column;
}
.screen-body { flex: 1; overflow: hidden; padding-bottom: var(--space-2); }

/* 상단 바 */
.appbar {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-4) var(--space-4) var(--space-3);
}
.appbar h2 {
  font-size: var(--font-size-xl); letter-spacing: var(--letter-spacing-tight);
  line-height: var(--line-height-tight);
}
.appbar .spacer { margin-left: auto; }

.iconbtn {
  min-width: var(--touch-target-min); min-height: var(--touch-target-min);
  display: inline-flex; align-items: center; justify-content: center;
  border: none; background: none; border-radius: var(--radius-pill);
  color: var(--color-text-primary); cursor: pointer; font: inherit;
}
.iconbtn:focus-visible { outline: 3px solid var(--color-focus-ring); outline-offset: 2px; }

/* 검색 */
.search {
  margin: 0 var(--space-4) var(--space-3);
  display: flex; align-items: center; gap: var(--space-2);
  background: var(--color-surface-sunken);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-pill);
  padding: 0 var(--space-4); min-height: var(--touch-target-min);
}
.search input {
  flex: 1; border: none; background: none; font: inherit;
  color: var(--color-text-primary); min-height: var(--touch-target-min);
}
.search input::placeholder { color: var(--color-text-secondary); }
.search input:focus-visible { outline: none; }
.search:focus-within { outline: 3px solid var(--color-focus-ring); outline-offset: 1px; }

/* 분류 칩 — 6개라 한 줄에 안 들어간다. 가로 스크롤. */
.chips {
  display: flex; gap: var(--space-2); overflow-x: auto;
  padding: 0 var(--space-4) var(--space-3); list-style: none;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; min-height: var(--touch-target-min);
  display: inline-flex; align-items: center; padding: 0 var(--space-4);
  border-radius: var(--radius-pill); border: 1px solid var(--color-border);
  background: var(--color-surface-raised); color: var(--color-text-secondary);
  font-size: var(--font-size-sm); font-weight: var(--font-weight-medium);
  cursor: pointer; white-space: nowrap; font-family: inherit;
}
.chip[aria-pressed="true"] {
  background: var(--color-surface-accent);
  border-color: var(--color-accent);
  color: var(--color-accent-text);
  font-weight: var(--font-weight-bold);
}
.chip:focus-visible { outline: 3px solid var(--color-focus-ring); outline-offset: 2px; }

/* 레시피 카드 격자 — 이미지가 전부 320x320이라 1:1 2열이 화면 픽셀과 맞는다 */
.grid {
  display: grid; grid-template-columns: repeat(var(--recipe-grid-columns), 1fr);
  gap: var(--space-3); padding: 0 var(--space-4); list-style: none;
}
.card {
  background: var(--color-surface-raised);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md); overflow: hidden;
  display: flex; flex-direction: column;
}
.card-media { position: relative; aspect-ratio: var(--recipe-card-aspect); background: var(--color-surface-sunken); }
.card-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-fav {
  position: absolute; top: var(--space-2); right: var(--space-2);
  width: var(--touch-target-min); height: var(--touch-target-min);
  border: none; border-radius: var(--radius-pill); cursor: pointer;
  background: rgba(253, 253, 251, 0.92); color: var(--color-danger-fill);
  display: grid; place-items: center; font-size: var(--font-size-lg);
}
.card-fav:focus-visible { outline: 3px solid var(--color-focus-ring); outline-offset: 2px; }
.card-body { padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-1); }
.card-title {
  font-size: var(--font-size-sm); font-weight: var(--font-weight-bold);
  line-height: var(--line-height-tight);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-meta { font-size: var(--font-size-xs); color: var(--color-text-secondary); }

.badge {
  display: inline-flex; align-items: center; gap: 0.25em;
  padding: 0.15em var(--space-2); border-radius: var(--radius-pill);
  font-size: var(--font-size-xs); font-weight: var(--font-weight-bold);
  background: var(--color-surface-accent); color: var(--color-accent-text);
}
.badge--fill { background: var(--color-success-fill); color: var(--color-text-on-fill); }
.badge--warn { background: var(--color-warning-fill); color: var(--color-text-on-fill); }

/* 섹션 제목 */
.section-head {
  display: flex; align-items: baseline; gap: var(--space-2);
  padding: var(--space-4) var(--space-4) var(--space-2);
}
.section-head h3 { font-size: var(--font-size-lg); letter-spacing: var(--letter-spacing-tight); }
.section-head span { font-size: var(--font-size-xs); color: var(--color-text-secondary); }

/* 큰 버튼 */
.cta {
  display: flex; align-items: center; justify-content: center; gap: var(--space-2);
  width: 100%; min-height: var(--touch-target-min);
  border: none; border-radius: var(--radius-pill); cursor: pointer;
  background: var(--color-accent); color: var(--color-text-on-accent);
  font: inherit; font-weight: var(--font-weight-bold); font-size: var(--font-size-base);
  padding: var(--space-3) var(--space-4);
}
.cta:hover { background: var(--color-accent-strong); }
.cta:focus-visible { outline: 3px solid var(--color-focus-ring); outline-offset: 2px; }
.cta--ghost {
  background: none; color: var(--color-accent-text);
  border: 1px solid var(--color-accent);
}
.cta--ghost:hover { background: var(--color-surface-accent); }

/* 냉장고 재료 목록 */
.pantry { list-style: none; padding: 0 var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
.pantry li {
  display: flex; align-items: center; gap: var(--space-3);
  background: var(--color-surface-raised);
  border: 1px solid var(--color-border); border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
}
.pantry .name { flex: 1; font-size: var(--font-size-base); font-weight: var(--font-weight-medium); }
.pantry .expiry { font-size: var(--font-size-xs); color: var(--color-text-secondary); }
.pantry .expiry.soon { color: var(--color-warning-text); font-weight: var(--font-weight-bold); }
.stepper { display: flex; align-items: center; gap: var(--space-1); }
.stepper button {
  width: var(--touch-target-min); height: var(--touch-target-min);
  border: 1px solid var(--color-border-strong); background: var(--color-surface-base);
  border-radius: var(--radius-pill); cursor: pointer; font: inherit;
  color: var(--color-text-primary); font-size: var(--font-size-lg); line-height: 1;
}
.stepper button:focus-visible { outline: 3px solid var(--color-focus-ring); outline-offset: 2px; }
.stepper .qty { min-width: 2.5em; text-align: center; font-variant-numeric: tabular-nums; font-size: var(--font-size-sm); }

/* 하단 고정 영역 */
.sheet {
  margin-top: auto; padding: var(--space-3) var(--space-4);
  background: var(--color-surface-raised);
  border-top: 1px solid var(--color-border);
}
.sheet .summary {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: var(--space-3); font-size: var(--font-size-sm);
  color: var(--color-text-secondary);
}
.sheet .summary strong { color: var(--color-text-primary); font-size: var(--font-size-base); }

/* 하단 탭바 */
.tabbar {
  display: flex; border-top: 1px solid var(--color-border);
  background: var(--color-surface-raised);
}
.tabbar a {
  flex: 1; min-height: var(--touch-target-min);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 0.15em; padding: var(--space-2) 0; text-decoration: none;
  color: var(--color-text-secondary); font-size: var(--font-size-xs);
}
.tabbar a[aria-current="page"] { color: var(--color-accent-text); font-weight: var(--font-weight-bold); }
.tabbar a:focus-visible { outline: 3px solid var(--color-focus-ring); outline-offset: -3px; }
.tabbar .ico { font-size: var(--font-size-lg); line-height: 1; }

/* 상세 화면 */
.hero { position: relative; aspect-ratio: var(--recipe-card-aspect); background: var(--color-surface-sunken); }
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero .back {
  position: absolute; top: var(--space-3); left: var(--space-3);
  background: rgba(253, 253, 251, 0.92);
}
.detail-head { padding: var(--space-4) var(--space-4) var(--space-2); }
.detail-head h2 { font-size: var(--font-size-xl); line-height: var(--line-height-tight); letter-spacing: var(--letter-spacing-tight); }
.detail-meta { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-2); }

.nutrients { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); padding: var(--space-2) var(--space-4); list-style: none; }
.nutrients li {
  background: var(--color-surface-sunken); border-radius: var(--radius-sm);
  padding: var(--space-2); text-align: center;
}
.nutrients dt { font-size: var(--font-size-xs); color: var(--color-text-secondary); }
.nutrients dd { font-size: var(--font-size-sm); font-weight: var(--font-weight-bold); font-variant-numeric: tabular-nums; }

.ing-group { padding: 0 var(--space-4); }
/* h3을 쓴다(h4가 아니라) - 앞에 오는 제목이 h2라서 h4로 가면 단계를 건너뛴다.
   크기는 토큰으로 따로 잡으므로 태그를 바꿔도 보이는 건 그대로다. */
.ing-group h3 { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin: var(--space-3) 0 var(--space-2); font-weight: var(--font-weight-bold); }
.ing-list { list-style: none; display: flex; flex-direction: column; gap: var(--space-1); }
.ing-list li { display: flex; align-items: center; gap: var(--space-2); font-size: var(--font-size-sm); }
.ing-list .amt { margin-left: auto; color: var(--color-text-secondary); font-variant-numeric: tabular-nums; }
.ing-list .missing .name { color: var(--color-warning-text); font-weight: var(--font-weight-bold); }

.steps { list-style: none; padding: 0 var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
.steps li { display: flex; gap: var(--space-3); }
.steps .no {
  flex: 0 0 auto; width: 1.75rem; height: 1.75rem; border-radius: var(--radius-pill);
  background: var(--color-accent); color: var(--color-text-on-accent);
  display: grid; place-items: center; font-size: var(--font-size-xs); font-weight: var(--font-weight-bold);
}
.steps p { font-size: var(--font-size-sm); line-height: var(--line-height-loose); }

/* 로그인 */
.auth { padding: var(--space-12) var(--space-6) var(--space-6); display: flex; flex-direction: column; height: 100%; }
.auth .brand { text-align: center; margin-bottom: var(--space-10); }
.auth .brand .logo {
  width: 4rem; height: 4rem; margin: 0 auto var(--space-3);
  border-radius: var(--radius-lg); background: var(--color-accent);
  color: var(--color-text-on-accent); display: grid; place-items: center; font-size: var(--font-size-2xl);
}
.auth .brand h2 { font-size: var(--font-size-2xl); letter-spacing: var(--letter-spacing-tight); }
.auth .brand p { color: var(--color-text-secondary); font-size: var(--font-size-sm); margin-top: var(--space-1); }
.field { display: flex; flex-direction: column; gap: var(--space-1); margin-bottom: var(--space-4); }
.field label { font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); }
.field input {
  min-height: var(--touch-target-min); padding: 0 var(--space-4);
  border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm);
  background: var(--color-surface-raised); color: var(--color-text-primary); font: inherit;
}
.field input:focus-visible { outline: 3px solid var(--color-focus-ring); outline-offset: 1px; }
.field .hint { font-size: var(--font-size-xs); color: var(--color-text-secondary); }
.auth .foot { margin-top: var(--space-4); text-align: center; font-size: var(--font-size-sm); color: var(--color-text-secondary); }
.auth .foot a { color: var(--color-accent-text); font-weight: var(--font-weight-bold); }

/* 콜드스타트 안내 — 무료 티어라 첫 요청이 36초 걸린다. 빈 화면 대신 이 상태를 보여준다. */
.wake {
  margin: var(--space-3) var(--space-4); padding: var(--space-3);
  background: var(--color-surface-accent); border-radius: var(--radius-md);
  display: flex; gap: var(--space-3); align-items: flex-start;
}
.wake .ico { font-size: var(--font-size-lg); line-height: 1.2; }
.wake p { font-size: var(--font-size-sm); color: var(--color-accent-text); }
.wake p small { display: block; color: var(--color-text-secondary); font-size: var(--font-size-xs); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
</style>
</head>
<body>

<div class="toolbar">
  <div>
    <h1>냉장고 한끼 V3 — 핵심 화면 시안</h1>
    <p>design/tokens.css의 변수만 사용. 데이터는 운영 DB의 실제 레시피다.</p>
  </div>
  <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false">
    다크 모드로 보기
  </button>
</div>

<main class="frames">

  <!-- 1. 홈 -->
  <figure class="frame">
    <figcaption>1 · 홈</figcaption>
    <div class="screen">
      <div class="screen-body">
        <header class="appbar">
          <h2>오늘 뭐 먹지?</h2>
          <span class="spacer"></span>
          <button class="iconbtn" type="button" aria-label="알림">🔔</button>
        </header>

        <div class="search">
          <span aria-hidden="true">🔍</span>
          <label class="sr-only" for="home-q">레시피 검색</label>
          <input id="home-q" type="search" placeholder="레시피 이름으로 찾기">
        </div>

        <ul class="chips">
          <li><button class="chip" type="button" aria-pressed="true">전체</button></li>
          <li><button class="chip" type="button" aria-pressed="false">반찬</button></li>
          <li><button class="chip" type="button" aria-pressed="false">일품</button></li>
          <li><button class="chip" type="button" aria-pressed="false">국&amp;찌개</button></li>
          <li><button class="chip" type="button" aria-pressed="false">밥</button></li>
          <li><button class="chip" type="button" aria-pressed="false">후식</button></li>
        </ul>

        <div class="wake">
          <span class="ico" aria-hidden="true">☕</span>
          <p>서버를 깨우는 중이에요
            <small>무료 서버라 첫 요청은 30초쯤 걸려요. 그동안 둘러보세요.</small>
          </p>
        </div>

        <div class="section-head">
          <h3>인기 레시피</h3>
          <span>1,148개 중</span>
        </div>
        <ul class="grid">
          <li class="card">
            <div class="card-media">
              <img src="https://www.foodsafetykorea.go.kr/uploadimg/cook/10_00111_2.png" alt="칠곡석류국수">
              <button class="card-fav" type="button" aria-label="칠곡석류국수 즐겨찾기">♡</button>
            </div>
            <div class="card-body">
              <p class="card-title">칠곡석류국수</p>
              <p class="card-meta">일품 · 73 kcal</p>
            </div>
          </li>
          <li class="card">
            <div class="card-media">
              <img src="https://www.foodsafetykorea.go.kr/uploadimg/cook/10_00094_2.png" alt="브로콜리 컬리플라워 샐러드와 두유 요거트 소스">
              <button class="card-fav" type="button" aria-label="브로콜리 컬리플라워 샐러드 즐겨찾기">♡</button>
            </div>
            <div class="card-body">
              <p class="card-title">브로콜리 컬리플라워 샐러드와 두유 요거트 소스</p>
              <p class="card-meta">반찬 · 210 kcal</p>
            </div>
          </li>
        </ul>
      </div>

      <nav class="tabbar" aria-label="주요 메뉴">
        <a href="#" aria-current="page"><span class="ico" aria-hidden="true">🏠</span>홈</a>
        <a href="#"><span class="ico" aria-hidden="true">🧊</span>냉장고</a>
        <a href="#"><span class="ico" aria-hidden="true">✨</span>추천</a>
        <a href="#"><span class="ico" aria-hidden="true">👤</span>마이</a>
      </nav>
    </div>
  </figure>

  <!-- 2. 냉장고 -->
  <figure class="frame">
    <figcaption>2 · 냉장고</figcaption>
    <div class="screen">
      <div class="screen-body">
        <header class="appbar">
          <h2>내 냉장고</h2>
          <span class="spacer"></span>
          <button class="iconbtn" type="button" aria-label="사진으로 재료 추가">📷</button>
        </header>

        <div class="search">
          <span aria-hidden="true">＋</span>
          <label class="sr-only" for="pantry-q">재료 추가</label>
          <input id="pantry-q" type="search" placeholder="재료 이름을 입력하세요">
        </div>

        <div class="section-head">
          <h3>보유 재료</h3>
          <span>5개</span>
        </div>

        <ul class="pantry">
          <li>
            <span class="name">고등어</span>
            <span class="expiry soon">2일 남음</span>
            <span class="stepper">
              <button type="button" aria-label="고등어 줄이기">−</button>
              <span class="qty">1</span>
              <button type="button" aria-label="고등어 늘리기">＋</button>
            </span>
          </li>
          <li>
            <span class="name">두부</span>
            <span class="expiry">6일 남음</span>
            <span class="stepper">
              <button type="button" aria-label="두부 줄이기">−</button>
              <span class="qty">2</span>
              <button type="button" aria-label="두부 늘리기">＋</button>
            </span>
          </li>
          <li>
            <span class="name">양파</span>
            <span class="expiry">12일 남음</span>
            <span class="stepper">
              <button type="button" aria-label="양파 줄이기">−</button>
              <span class="qty">3</span>
              <button type="button" aria-label="양파 늘리기">＋</button>
            </span>
          </li>
          <li>
            <span class="name">달걀</span>
            <span class="expiry">9일 남음</span>

  btn.setAttribute('aria-pressed', String(!dark));
